<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>PM Template Phases (Transfer) Rev. 0.3</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0D1117;--surface:#161B22;--surface2:#1C2330;--border:#30363D;--text:#E6EDF3;--muted:#8B949E;--green:#1D9E75;--red:#E24B4A;--blue:#378ADD;--font:'DM Sans',sans-serif;--mono:'DM Mono',monospace}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;min-height:100vh}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;justify-content:space-between;align-items:center}
.header-title{font-size:15px;font-weight:500}
.header-sub{font-size:11px;color:var(--muted);font-family:var(--mono)}
main{padding:20px 24px;max-width:1100px;margin:0 auto}
.loading{text-align:center;padding:60px;color:var(--muted)}
.spinner{display:inline-block;width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite;margin-right:8px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.err{background:#1a0f0f;border:1px solid #4a1515;border-radius:8px;padding:14px 18px;color:var(--red);font-size:13px;margin:16px 0}
.gauges-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.gauge-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:8px}
.gauge-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-family:var(--mono)}
.gauge-status{font-size:13px;font-weight:500;font-family:var(--mono)}
.on-time{color:var(--green)}.delayed{color:var(--red)}
.gauge-detail{font-size:10px;color:var(--muted);font-family:var(--mono)}
.phase-bar{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 16px;margin-bottom:14px;display:flex;align-items:center;gap:12px}
.phase-bar label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-family:var(--mono);white-space:nowrap}
select{background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:var(--mono);font-size:12px;padding:6px 10px;flex:1;outline:none;cursor:pointer}
select:focus{border-color:var(--green)}
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.kpi-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-family:var(--mono);margin-bottom:6px}
.kpi-val{font-size:26px;font-weight:300;font-family:var(--mono)}
.kpi-val.red{color:var(--red)}.kpi-val.green{color:var(--green)}
.kpi-sub{font-size:10px;color:var(--muted);font-family:var(--mono);margin-top:2px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px 20px;margin-bottom:14px}
.card-title{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-family:var(--mono);margin-bottom:14px}
.phase-row-item{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.phase-row-item:last-child{margin-bottom:0}
.phase-name-col{font-size:12px;color:var(--text);width:180px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--mono)}
.bar-bg{flex:1;background:var(--surface2);border-radius:3px;height:6px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;transition:width .6s}
.phase-pct-col{font-size:11px;color:var(--muted);width:36px;text-align:right;font-family:var(--mono)}
.phase-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
table{width:100%;border-collapse:collapse}
th{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-family:var(--mono);text-align:left;padding:8px 10px;border-bottom:1px solid var(--border)}
td{font-size:12px;padding:8px 10px;border-bottom:1px solid #1e2530;vertical-align:middle;font-family:var(--mono)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--surface2)}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-family:var(--mono)}
.tag-late{background:#2a1010;color:var(--red);border:1px solid #4a1515}
.tag-prog{background:#0a1a2a;color:var(--blue);border:1px solid #1a3a5a}
.tag-nd{background:var(--surface2);color:var(--muted);border:1px solid var(--border)}
.tag-done{background:#0a1a12;color:var(--green);border:1px solid #1a3a2a}
#refresh-btn{background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--muted);font-family:var(--mono);font-size:11px;padding:5px 12px;cursor:pointer}
#refresh-btn:hover{border-color:var(--green);color:var(--green)}
</style>
</head>
<body>
<header>
  <div>
    <div class="header-title">PM Template Phases (Transfer) Rev. 0.3</div>
    <div class="header-sub" id="last-update">Loading…</div>
  </div>
  <button id="refresh-btn" onclick="loadData()">↻ Refresh</button>
</header>
<main>
  <div id="loading" class="loading"><span class="spinner"></span> Fetching data from OneDrive…</div>
  <div id="error" style="display:none"></div>
  <div id="dashboard" style="display:none">
    <div class="gauges-row">
      <div class="gauge-card">
        <div class="gauge-label">Project overall</div>
        <svg viewBox="0 0 200 120" width="200" height="120">
          <path d="M20,100 A80,80 0 0,1 180,100" fill="none" stroke="#1C2330" stroke-width="16" stroke-linecap="round"/>
          <path id="arc-proj" d="M20,100 A80,80 0 0,1 180,100" fill="none" stroke="#1D9E75" stroke-width="16" stroke-linecap="round" stroke-dasharray="251" stroke-dashoffset="251"/>
          <text id="pct-proj" x="100" y="94" text-anchor="middle" font-size="28" font-weight="300" fill="#E6EDF3" font-family="DM Mono,monospace">0%</text>
        </svg>
        <div id="status-proj" class="gauge-status">—</div>
        <div id="detail-proj" class="gauge-detail"></div>
      </div>
      <div class="gauge-card">
        <div class="gauge-label" id="phase-gauge-label">Active phase</div>
        <svg viewBox="0 0 200 120" width="200" height="120">
          <path d="M20,100 A80,80 0 0,1 180,100" fill="none" stroke="#1C2330" stroke-width="16" stroke-linecap="round"/>
          <path id="arc-phase" d="M20,100 A80,80 0 0,1 180,100" fill="none" stroke="#378ADD" stroke-width="16" stroke-linecap="round" stroke-dasharray="251" stroke-dashoffset="251"/>
          <text id="pct-phase" x="100" y="94" text-anchor="middle" font-size="28" font-weight="300" fill="#E6EDF3" font-family="DM Mono,monospace">0%</text>
        </svg>
        <div id="status-phase" class="gauge-status">—</div>
        <div id="detail-phase" class="gauge-detail"></div>
      </div>
    </div>

    <div class="phase-bar">
      <label>Active phase</label>
      <select id="phase-select" onchange="switchPhase()"></select>
    </div>

    <div class="kpi-row">
      <div class="kpi"><div class="kpi-label">Total tasks</div><div class="kpi-val" id="kpi-total">—</div></div>
      <div class="kpi"><div class="kpi-label">Completed</div><div class="kpi-val green" id="kpi-done">—</div><div class="kpi-sub" id="kpi-done-pct"></div></div>
      <div class="kpi"><div class="kpi-label">In progress</div><div class="kpi-val" id="kpi-prog">—</div></div>
      <div class="kpi"><div class="kpi-label">Overdue</div><div class="kpi-val red" id="kpi-late">—</div><div class="kpi-sub" id="kpi-late-sub"></div></div>
    </div>

    <div class="card">
      <div class="card-title">Progress by phase</div>
      <div id="phases-list"></div>
    </div>

    <div class="card">
      <div class="card-title" id="tasks-title">Pending tasks</div>
      <div id="tasks-table"></div>
    </div>
  </div>
</main>
<script>
const DOWNLOAD_URL="https://1drv.ms/x/c/ac9f312e3dbd6424/IQBxjtovE7VySrtUft7-elzAAfPg6y5LeV9xNcjbpZchR2U?download=1";
const PROXY="https://corsproxy.io/?";
const TODAY=new Date(); TODAY.setHours(0,0,0,0);
const COLORS=['#1D9E75','#378ADD','#BA7517','#D4537E','#7F77DD','#639922','#E24B4A','#5DCAA5'];
let allTasks=[],phaseMap={},phaseColors={};

function parseDate(v){
  if(!v||v==='NA') return null;
  if(v instanceof Date) return v;
  if(typeof v==='number') return new Date(Math.round((v-25569)*86400*1000));
  const d=new Date(v); return isNaN(d)?null:d;
}
function getPct(r){ return Math.min(parseFloat(r['Percent_Complete'])||0,100); }
function fmtDate(d){ if(!d)return'—'; return d.toLocaleDateString('en-US',{month:'short',day:'2-digit',year:'2-digit'}); }
function taskStatus(r){
  const pct=getPct(r);
  if(pct>=100) return'done';
  const active=String(r['Active']||'').trim();
  if(active==='No') return'inactive';
  const f=parseDate(r['Finish_Date']);
  if(f&&f<TODAY&&pct<100) return'late';
  if(pct>0) return'prog';
  return'nd';
}
function isDelayed(tasks){ return tasks.some(r=>taskStatus(r)==='late'); }
function setGauge(arcId,pctId,pct,color){
  const total=251,offset=total-(total*Math.min(pct,100)/100);
  document.getElementById(arcId).setAttribute('stroke-dashoffset',Math.round(offset));
  document.getElementById(arcId).setAttribute('stroke',color);
  document.getElementById(pctId).textContent=Math.round(pct)+'%';
}

function getPhaseLabel(r){
  const wbs=String(r['WBS']||'').trim();
  const name=String(r['Task_Name']||'').trim();
  const level=parseInt(r['Outline_Level'])||0;
  if(level===1) return name;
  // use first segment of WBS to group
  return wbs.split('.')[0];
}

function switchPhase(){
  const sel=document.getElementById('phase-select').value;
  const tasks=(phaseMap[sel]||[]).filter(r=>String(r['Active']||'').trim()!=='No');
  const avg=tasks.length?tasks.map(getPct).reduce((a,b)=>a+b,0)/tasks.length:0;
  const delayed=isDelayed(tasks);
  const color=delayed?'#E24B4A':(phaseColors[sel]||'#378ADD');
  setGauge('arc-phase','pct-phase',avg,color);
  const el=document.getElementById('status-phase');
  el.textContent=delayed?'⚠ DELAYED':'✓ ON TIME';
  el.className='gauge-status '+(delayed?'delayed':'on-time');
  document.getElementById('phase-gauge-label').textContent=sel;
  document.getElementById('detail-phase').textContent=tasks.length+' tasks in phase';
  renderTasksTable(tasks,sel+' — pending tasks');
}

function renderPhasesBar(){
  const keys=Object.keys(phaseMap);
  let html='';
  keys.forEach((ph,i)=>{
    const tasks=(phaseMap[ph]||[]).filter(r=>String(r['Active']||'').trim()!=='No');
    if(!tasks.length) return;
    const avg=Math.round(tasks.map(getPct).reduce((a,b)=>a+b,0)/tasks.length);
    const delayed=isDelayed(tasks);
    const color=delayed?'#E24B4A':COLORS[i%COLORS.length];
    phaseColors[ph]=COLORS[i%COLORS.length];
    html+=`<div class="phase-row-item">
      <div class="phase-dot" style="background:${color}"></div>
      <div class="phase-name-col" title="${ph}">${ph}</div>
      <div class="bar-bg"><div class="bar-fill" style="width:${avg}%;background:${color}"></div></div>
      <div class="phase-pct-col">${avg}%</div>
    </div>`;
  });
  document.getElementById('phases-list').innerHTML=html;
}

function renderTasksTable(tasks,title){
  document.getElementById('tasks-title').textContent=title||'Pending tasks';
  const pending=tasks.filter(r=>{const s=taskStatus(r);return s!=='done'&&s!=='inactive';})
    .sort((a,b)=>{const o={late:0,prog:1,nd:2};return(o[taskStatus(a)]||3)-(o[taskStatus(b)]||3);});
  if(!pending.length){
    document.getElementById('tasks-table').innerHTML='<p style="text-align:center;padding:20px;color:#8B949E;font-size:12px">All tasks completed ✓</p>';
    return;
  }
  const rows=pending.slice(0,25).map(r=>{
    const s=taskStatus(r);
    const tagClass={late:'tag-late',prog:'tag-prog',nd:'tag-nd'}[s]||'tag-nd';
    const tagLabel={late:'Overdue',prog:'In progress',nd:'Not started'}[s]||s;
    const owner=String(r['Resource_Names']||'—').trim()||'—';
    return`<tr>
      <td style="color:#E6EDF3;max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${String(r['Task_Name']||'').trim()}">${String(r['Task_Name']||'').trim()}</td>
      <td style="color:#8B949E">${owner}</td>
      <td>${fmtDate(parseDate(r['Finish_Date']))}</td>
      <td>${Math.round(getPct(r))}%</td>
      <td><span class="tag ${tagClass}">${tagLabel}</span></td>
    </tr>`;
  }).join('');
  document.getElementById('tasks-table').innerHTML=`<table>
    <thead><tr><th>Task</th><th>Owner</th><th>Due date</th><th>%</th><th>Status</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

async function loadData(){
  document.getElementById('loading').style.display='block';
  document.getElementById('dashboard').style.display='none';
  document.getElementById('error').style.display='none';
  try{
    let resp,ab;
    try{
      resp=await fetch(DOWNLOAD_URL);
      if(!resp.ok) throw new Error('direct: '+resp.status);
      ab=await resp.arrayBuffer();
    }catch(e){
      resp=await fetch(PROXY+encodeURIComponent(DOWNLOAD_URL));
      if(!resp.ok) throw new Error('proxy: '+resp.status);
      ab=await resp.arrayBuffer();
    }

    const wb=XLSX.read(ab,{type:'array',cellDates:true});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{defval:''});
    if(!rows.length) throw new Error('File empty');

    // only active tasks with a name
    allTasks=rows.filter(r=>String(r['Task_Name']||'').trim()!=='');

    // active tasks only for metrics
    const active=allTasks.filter(r=>String(r['Active']||'').trim()!=='No');

    const projPct=active.length?active.map(getPct).reduce((a,b)=>a+b,0)/active.length:0;
    const projDelayed=isDelayed(active);
    setGauge('arc-proj','pct-proj',projPct,projDelayed?'#E24B4A':'#1D9E75');
    const sp=document.getElementById('status-proj');
    sp.textContent=projDelayed?'⚠ DELAYED':'✓ ON TIME';
    sp.className='gauge-status '+(projDelayed?'delayed':'on-time');
    document.getElementById('detail-proj').textContent=active.length+' active tasks';

    const done=active.filter(r=>getPct(r)>=100).length;
    const late=active.filter(r=>taskStatus(r)==='late').length;
    const prog=active.filter(r=>taskStatus(r)==='prog').length;
    document.getElementById('kpi-total').textContent=active.length;
    document.getElementById('kpi-done').textContent=done;
    document.getElementById('kpi-done-pct').textContent=Math.round(done/active.length*100)+'% of total';
    document.getElementById('kpi-prog').textContent=prog;
    document.getElementById('kpi-late').textContent=late;
    document.getElementById('kpi-late-sub').textContent=late>0?'Action required':'All on track';

    // Build phase map using Outline_Level=1 rows as phase headers
    phaseMap={};
    let currentPhase='General';
    allTasks.forEach(r=>{
      const level=parseInt(r['Outline_Level'])||0;
      const name=String(r['Task_Name']||'').trim();
      if(level===1){
        currentPhase=name;
        if(!phaseMap[currentPhase]) phaseMap[currentPhase]=[];
      } else {
        if(!phaseMap[currentPhase]) phaseMap[currentPhase]=[];
        phaseMap[currentPhase].push(r);
      }
    });

    renderPhasesBar();

    const sel=document.getElementById('phase-select');
    sel.innerHTML='';
    Object.keys(phaseMap).forEach(ph=>{
      const activeTasks=(phaseMap[ph]||[]).filter(r=>String(r['Active']||'').trim()!=='No');
      if(!activeTasks.length) return;
      const o=document.createElement('option');
      o.value=ph;
      o.textContent=ph+' ('+activeTasks.length+')';
      sel.appendChild(o);
    });

    document.getElementById('last-update').textContent='Last update: '+new Date().toLocaleString('en-US');
    document.getElementById('loading').style.display='none';
    document.getElementById('dashboard').style.display='block';
    switchPhase();

  }catch(err){
    document.getElementById('loading').style.display='none';
    const e=document.getElementById('error');
    e.style.display='block';
    e.className='err';
    e.innerHTML='<b>Error:</b> '+err.message;
  }
}
loadData();
</script>
</body>
</html>
